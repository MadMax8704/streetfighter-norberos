# A jatek a public/ mappabol megy ki, a Function a netlify/functions-bol.
# Igy a functions forras es a node_modules nem kerul fel a publikus oldalra.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# PWA: a service worker és a manifest ne legyen cache-elve a CDN-en,
# hogy az SW frissítés azonnal eljuthasson (új precache verzió).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
